name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The Harness packages this plugin develops against are on npm, but NOT
      # under the `latest` tag (npm's `latest` for @deepseek-ai/dsh-tools is
      # still the placeholder 0.0.1-rc.1). devDependencies pins the exact
      # versions, so a plain install resolves the real harness packages and the
      # integration layers run instead of skipping.
      - name: 安装依赖
        run: npm install --no-package-lock

      - name: 敏感信息扫描
        run: npm run audit

      - name: 单元与集成测试
        run: npm test

      # The harness-dependent layers skip themselves when the peer packages do
      # not resolve — which is the right behaviour on a clean clone, but on CI
      # the packages are pinned in devDependencies. A silent skip there would
      # mean the guard is proving nothing, so assert it never happens.
      - name: 断言依赖层没有被静默跳过
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tap.txt
          if grep -qE '^# skipped [1-9]' /tmp/tap.txt; then
            echo "::error::harness-dependent tests skipped — the pinned packages did not resolve"
            exit 1
          fi

      - name: 产物一致性（技能文件 / 单文件网页）
        run: npm run skill:check && npm run web:check

      # 真机组合：内置工具注册表 + 真实 WebServer，打真 HTTP 路由。
      # 0.2.2-alpha.2 把工具描述的归属挪到 executor 后，这一层是最先炸的地方
      # （缺 executor 会抛 TOOL_EXECUTOR_UNAVAILABLE），所以让它进 CI 看着。
      - name: 真机组合与真实 HTTP 路由
        run: npm run verify:plugin

      # ubuntu-latest ships Google Chrome, which scripts/verify-web.mjs finds on
      # its own. The plugin-level suite skips itself here because the harness
      # packages are not published — that is expected, not a gap to paper over.
      - name: 浏览器端端到端
        run: npm run verify
